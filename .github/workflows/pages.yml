name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'robots.txt'
      - 'assets/site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare site
        run: |
          mkdir -p _site/assets/site
          cp index.html robots.txt .nojekyll _site/
          cp assets/site/donate-qr.png assets/site/shaiwin.ico assets/site/shaiwin.png _site/assets/site/

      # 仓库的 Pages 已设为 GitHub Actions 发布，直接上传静态文件。
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
